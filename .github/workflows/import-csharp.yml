name: Sincronizar CSharp validado no Android

on:
  push:
    branches:
      - sync/csharp-mobile-validated-20261027
    paths:
      - ".github/workflows/import-csharp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csharp-core-validated-sync
  cancel-in-progress: false

jobs:
  importar:
    if: github.ref == 'refs/heads/sync/csharp-mobile-validated-20261027'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar revisao validada no Terraria Android
        env:
          SOURCE_SHA: 4119582942c43b3dc52f4edf96c366a190630ac9
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MantovaniDevTrue/Bunnyloader-Csharp.git _source
          git -C _source fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C _source checkout --detach "$SOURCE_SHA"
          test "$(git -C _source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Sincronizar nucleo, dependencias e ExampleMod CSharp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app experiments samples tests tools gradle docs/csharp
          rm -f docs/csharp-*.md docs/csharp-*.json
          rm -f build.gradle.kts settings.gradle.kts gradle.properties .gitattributes .gitignore keystore.properties.example
          rm -f LICENSE.md LICENSING.md THIRD_PARTY_NOTICES.md TRADEMARKS.md CONTRIBUTING.md SECURITY.md
          mkdir -p app experiments/csharp samples tests tools docs gradle

          rsync -a _source/app/ app/
          for module in BunnyCsSdk BunnySourceSdk BunnySourceCompiler BunnyManagedProbe BunnyCsPackager; do
            test -d "_source/experiments/csharp/$module"
            rsync -a "_source/experiments/csharp/$module/" "experiments/csharp/$module/"
          done

          rsync -a _source/samples/ExampleMod/ samples/ExampleMod/
          rsync -a _source/samples/HelloMod/ samples/HelloMod/
          rsync -a _source/samples/StarterModCSharp/ samples/StarterModCSharp/
          rsync -a _source/samples/ExampleModCSharp/ samples/ExampleModCSharp/
          rsync -a _source/tests/ tests/
          rsync -a --exclude='tests/' _source/tools/ tools/
          rsync -a _source/gradle/ gradle/

          for entry in .gitattributes .gitignore build.gradle.kts settings.gradle.kts gradle.properties keystore.properties.example LICENSE.md LICENSING.md THIRD_PARTY_NOTICES.md TRADEMARKS.md CONTRIBUTING.md SECURITY.md; do
            if [ -f "_source/$entry" ]; then
              cp -a "_source/$entry" "$entry"
            fi
          done

          printf '\n# Mono ARM64 incluido na entrega\n!app/src/main/jniLibs/arm64-v8a/*.so\n' >> .gitignore

          cat > SOURCE_VERSION.md <<'EOF'
          # Origem da base C#

          - Fonte: https://github.com/MantovaniDevTrue/Bunnyloader-Csharp
          - Commit de origem: `4119582942c43b3dc52f4edf96c366a190630ac9`
          - Branch de QA: `qa/pr180-damageclass-apk-20261026`
          - APK validado: Bunny Loader C# 1.0.25, release `csharp-unified-qa-4119582942c4`
          - Validacao no Terraria Android: aprovada pelo desenvolvedor em aparelho real, apos os testes automatizados do workflow 40434694323
          - Escopo: nucleo C#, SDK, Roslyn, MonoVM, integracao nativa Android e dependencias correspondentes, com ExampleMod C# 0.1.71

          Todos os arquivos importados do projeto Android e dos modulos C# sao da mesma revisao de origem. Os exemplos e ferramentas de pesquisa fora do escopo do nucleo continuam excluidos.

          Esta fonte nao inclui os binarios proprietarios do Terraria, dumps do jogo, chaves de assinatura ou APKs. A validacao em aparelho confirma a build indicada acima; nao equivale a certificar individualmente todas as APIs.
          EOF

          test -f experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj
          test -f experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
          test -f experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj
          test -f experiments/csharp/BunnyManagedProbe/BunnyManagedProbe.csproj
          test -f app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
          test -f app/src/main/kotlin/dev/bunnyloader/csharp/ManagedProbeService.kt
          test -f app/src/main/assets/managed/BunnySourceCompiler.dll
          test -f app/src/main/assets/managed/framework.sha256
          test -f app/src/main/jniLibs/arm64-v8a/libmonosgen-2.0.so
          test -f tools/mono/prebuilt/arm64-v8a/DOTNET_RUNTIME_LICENSE.txt
          test -f app/src/main/cpp/CMakeLists.txt
          test -f samples/HelloMod/content/main.js
          test -f samples/ExampleMod/content/main.js
          test ! -d docs/csharp
          test -f samples/ExampleModCSharp/Playable/content/Common/DamageClasses/ExampleDamageClass.cs
          test ! -d experiments/csharp/BunnyCsPrototype
          test ! -d experiments/csharp/BunnyPrefixResearch
          test ! -d experiments/csharp/BunnyVmBenchmark67
          test ! -e app/libs/unity-classes.jar
          test ! -e app/src/main/res/font/bunny.ttf
          test ! -e keystore.properties

          printf 'Arquivos apos limpeza: '
          find app experiments samples tests tools -type f | wc -l

      - name: Preparar .NET para validacao
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Validar DamageClass gerenciado e contratos nativos
        shell: bash
        run: |
          set -euo pipefail
          dotnet run --project tests/DamageClassParity/DamageClassParity.csproj --configuration Release
          mkdir -p build/damageclass-sync
          c++ -std=c++20 -O2 -Wall -Wextra -Werror -Iapp/src/main/cpp tests/DamageClassParity/native_damageclass_combat.cpp -o build/damageclass-sync/combat
          build/damageclass-sync/combat
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -Wall -Wextra -Werror -Iapp/src/main/cpp tests/DamageClassParity/native_damageclass_tracking.cpp -o build/damageclass-sync/tracking
          build/damageclass-sync/tracking
          c++ -std=c++20 -O1 -g -fsanitize=address,undefined -Wall -Wextra -Werror -Iapp/src/main/cpp tests/DamageClassParity/native_damageclass_tooltip.cpp -o build/damageclass-sync/tooltip
          build/damageclass-sync/tooltip

      - name: Atualizar branch validada
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f app/src/main/jniLibs/arm64-v8a/*.so
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
            exit 0
          fi
          git commit -m "feat: sync approved Android CSharp core and matching dependencies"
          git push origin HEAD:sync/csharp-mobile-validated-20261027
