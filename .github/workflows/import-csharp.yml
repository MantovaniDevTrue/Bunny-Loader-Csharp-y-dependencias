name: Importar base CSharp

on:
  push:
    paths:
      - ".github/workflows/import-csharp.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: csharp-core-import
  cancel-in-progress: false

jobs:
  importar:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Baixar base integrada anterior aos loaders experimentais
        env:
          SOURCE_SHA: cfbe784ee3cbc0ba2fabafce56c59e6eac41b67b
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout https://github.com/MantovaniDevTrue/Bunnyloader-Csharp.git _source
          git -C _source fetch --no-tags --depth=1 origin "$SOURCE_SHA"
          git -C _source checkout --detach "$SOURCE_SHA"
          test "$(git -C _source rev-parse HEAD)" = "$SOURCE_SHA"

      - name: Substituir snapshot experimental pelo nucleo CSharp
        shell: bash
        run: |
          set -euo pipefail
          rm -rf app experiments samples tests tools gradle docs/csharp
          rm -f docs/csharp-*.md docs/csharp-*.json
          rm -f build.gradle.kts settings.gradle.kts gradle.properties .gitattributes .gitignore keystore.properties.example
          rm -f LICENSE.md LICENSING.md THIRD_PARTY_NOTICES.md TRADEMARKS.md CONTRIBUTING.md SECURITY.md
          mkdir -p app experiments/csharp samples tests tools docs gradle

          rsync -a _source/app/ app/
          for module in BunnyCsSdk BunnySourceSdk BunnySourceCompiler BunnyManagedProbe BunnyCsPackager; do
            test -d "_source/experiments/csharp/$module"
            rsync -a "_source/experiments/csharp/$module/" "experiments/csharp/$module/"
          done

          rsync -a _source/samples/ExampleMod/ samples/ExampleMod/
          rsync -a _source/samples/HelloMod/ samples/HelloMod/
          rsync -a _source/samples/StarterModCSharp/ samples/StarterModCSharp/
          rsync -a _source/tests/ tests/
          rsync -a --exclude='tests/' _source/tools/ tools/
          rsync -a _source/gradle/ gradle/

          for entry in .gitattributes .gitignore build.gradle.kts settings.gradle.kts gradle.properties keystore.properties.example LICENSE.md LICENSING.md THIRD_PARTY_NOTICES.md TRADEMARKS.md CONTRIBUTING.md SECURITY.md; do
            if [ -f "_source/$entry" ]; then
              cp -a "_source/$entry" "$entry"
            fi
          done

          printf '\n# Mono ARM64 incluido na entrega\n!app/src/main/jniLibs/arm64-v8a/*.so\n' >> .gitignore

          cat > SOURCE_VERSION.md <<'EOF'
          # Origem da base CSharp

          - Repositório: https://github.com/MantovaniDevTrue/Bunnyloader-Csharp
          - Versão da fonte: v1.0 integrada, 19/10/2026
          - Commit: cfbe784ee3cbc0ba2fabafce56c59e6eac41b67b
          - Escopo: núcleo C#, projeto Android e dependências da mesma revisão

          Esta entrega não inclui os loaders, QA e exemplos experimentais desenvolvidos posteriormente. O host Android e os dois exemplos JavaScript usados pelo próprio projeto original permanecem como dependências da integração; eles não executam os callbacks C#.

          O runtime Mono modificado, as DLLs de Roslyn e SDK e as bibliotecas ARM64 pertencem ao mesmo snapshot. Os componentes proprietários do Terraria e chaves de assinatura não são distribuídos.

          A importação e as verificações de integridade não equivalem a validar todas as funcionalidades do Terraria no dispositivo.
          EOF

          test -f experiments/csharp/BunnyCsSdk/BunnyCsSdk.csproj
          test -f experiments/csharp/BunnySourceSdk/BunnySourceSdk.csproj
          test -f experiments/csharp/BunnySourceCompiler/BunnySourceCompiler.csproj
          test -f experiments/csharp/BunnyManagedProbe/BunnyManagedProbe.csproj
          test -f app/src/main/cpp/experiments/csharp/ManagedRuntime.cpp
          test -f app/src/main/kotlin/dev/bunnyloader/csharp/ManagedProbeService.kt
          test -f app/src/main/assets/managed/BunnySourceCompiler.dll
          test -f app/src/main/assets/managed/framework.sha256
          test -f app/src/main/jniLibs/arm64-v8a/libmonosgen-2.0.so
          test -f tools/mono/prebuilt/arm64-v8a/DOTNET_RUNTIME_LICENSE.txt
          test -f app/src/main/cpp/CMakeLists.txt
          test -f samples/HelloMod/content/main.js
          test -f samples/ExampleMod/content/main.js
          test ! -d docs/csharp
          test ! -d samples/ExampleModCSharp
          test ! -d experiments/csharp/BunnyCsPrototype
          test ! -d experiments/csharp/BunnyPrefixResearch
          test ! -d experiments/csharp/BunnyVmBenchmark67
          test ! -e app/libs/unity-classes.jar
          test ! -e app/src/main/res/font/bunny.ttf
          test ! -e keystore.properties

          printf 'Arquivos apos limpeza: '
          find app experiments samples tests tools -type f | wc -l

      - name: Publicar base limpa
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _source
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git add -f app/src/main/jniLibs/arm64-v8a/*.so
          if git diff --cached --quiet; then
            echo "Sem alteracoes"
            exit 0
          fi
          git commit -m "refactor: replace experimental snapshot with CSharp core and matching dependencies"
          git push origin HEAD:main
